name: self-test
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: unit and syntax checks
        run: |
          python3 -m compileall -q scripts tests
          python3 -m unittest discover -s tests -v
      - name: start local API contract double
        env:
          CSI_TEST_PORT: '18765'
        run: |
          python3 tests/mock_server.py &
          server_pid=$!
          echo "server_pid=$server_pid" >> "$GITHUB_ENV"
          ready=0
          for attempt in $(seq 1 20); do
            if python3 -c 'import socket; socket.create_connection(("127.0.0.1", 18765), 1).close()'; then
              ready=1
              break
            fi
            kill -0 "$server_pid"
            sleep 0.2
          done
          test "$ready" = "1"
      - id: scan
        continue-on-error: true
        uses: ./
        with:
          html-file: tests/fixtures/blocked.html
          page-origin: https://shop.example/checkout
          allowed-domains: js.stripe.com
          fail-on: high
          payment-page-scope: direct
          api-base: http://127.0.0.1:18765
      - name: the unauthorized script must have been caught
        run: |
          test "${{ steps.scan.outcome }}" = "failure"
          test "${{ steps.scan.outputs.passed }}" = "false"
          test "${{ steps.scan.outputs.findings }}" = "1"
      - name: stop local API contract double
        if: always()
        run: kill "$server_pid" 2>/dev/null || true
